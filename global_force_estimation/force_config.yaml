model_list:
  - - Resnet
    - 101 # (18, 34, 50, 101)
  - - Densenet
    - 169 # (121, 161, 169, 201)
model_choice: 1 # Densenet-169
pretrained: true
image_type: RGB # RGB or GRAY
train_mode: True
test_object: False

# Force-label layout. Dataset labels may be [4, 4, 3], [3, 4, 4],
# or a flattened vector containing 4*4*3 values.
force_map_height: 4
force_map_width: 4

# Weak train-only photometric augmentation. Validation, test, statistics,
# and real-time Estimator preprocessing remain deterministic.
augmentation:
  enabled: true
  seed: 42
  brightness:
    probability: 0.30
    limit: 0.05
  contrast:
    probability: 0.30
    limit: 0.05
  gamma:
    probability: 0.20
    range: [0.95, 1.05]
  rgb_channel_gain:
    probability: 0.20
    limit: 0.03
  gaussian_noise:
    probability: 0.15
    std_range: [0.0, 2.0]
  gaussian_blur:
    probability: 0.10
    kernel_size: 3
    sigma_range: [0.1, 0.5]

# Independent-node objective:
# L = wc*Lcontact + wa*Lactive + wang*Ltangent_angle
#     + wi*Linactive_zero + wsum*Ltotal_consistency
loss:
  contact_weight: 1.0
  active_force_weight: 1.0
  tangent_angle_weight: 0.2
  inactive_zero_weight: 0.05
  total_consistency_weight: 0.5
  contact_label_threshold_n: 0.05
  tangent_angle_threshold_n: 0.1
  focal_alpha: 0.75
  focal_gamma: 2.0
  smooth_l1_beta: 1.0

# Independent Sigmoid contacts permit 0..16 active nodes; no Top-K is used.
# The force gate uses compressive max(-Fz_node, 0), never abs(Fz_node).
inference:
  contact_probability_threshold: 0.5
  node_force_threshold_n: 0.05
  enforce_compressive_normal: true


# Evaluation thresholds in newtons. Tune them from a sufficiently large
# independent no-load calibration set rather than from the training set.
evaluation:
  active_threshold_n: 0.1
  contact_threshold_n: 0.05
  tangent_angle_threshold_n: 0.1
  no_load_threshold_n: 0.1
  zero_epsilon_n: 1.0e-6

# Directory containing the precomputed train.csv, validation.csv and test.csv.
data_dir: Datasets
save_dir: saved_models
# Generated by: python collected_data/balance_force_distribution.py --apply
# Set to null to train from the original train_*.npy indexes.
train_index_variant: balanced
validation_index_variant: balanced

weights:
  - - _08-17_13-53-15 # Resnet
    - 291 # epoch
  - - _09-22_15-17-06 # Densenet
    - 153 # epoch
eval_batch: 8

cuda_index: 0
batch_size: 16
num_epoch: 100
learning_rate: 1.0e-4
backbone_learning_rate: 5.0e-5
head_learning_rate: 5.0e-4

regularization: True
weight_decay: 1.0e-4

img_size:
  - 256
  - 320
